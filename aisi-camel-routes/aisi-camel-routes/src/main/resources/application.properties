spring.application.name=aisi-camel-routes
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=ENC(TY7JpjFZspddNl9YBmkrDA==)
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=aisi-camel
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2


camel.springboot.main-run-controller=true
camel.springboot.name=NetflixApiCamelContext
camel.springboot.stream-caching-enabled=true


management.endpoint.health.show-details=always

logging.level.hr.algebra=DEBUG
logging.level.org.apache.camel=INFO

spring.jackson.serialization.indent-output=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

camel.component.kafka.brokers=localhost:9094

management.endpoints.web.exposure.include=health,info,metrics,prometheus,camelroutes
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=aisi-camel-routes

camel.metrics.enable-route-policy=true
camel.metrics.enable-message-history=true
camel.metrics.enable-exchange-event-notifier=true

app.crypto.aes-key-hex=${APP_CRYPTO_AES_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.crypto.aes-iv-hex=${APP_CRYPTO_AES_IV:00112233445566778899aabbccddeeff}

jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.NoIvGenerator

